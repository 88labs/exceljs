name: Asset size

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  compare:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: flatt-security/setup-takumi-guard-npm@8f53b50568e4466f2d92504f349c05b9ffcb8b59 # v1
        with:
          bot-id: "BT01KJW2C86AE4TDJRN1YH21K840" # 88labs
      - uses: preactjs/compressed-size-action@f322c295dde06a1cb7ccaef105732dd8a726d1d9 # 2.10.0
        with:
          pattern: "./dist/*.{js,mjs}"
